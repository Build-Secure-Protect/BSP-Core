    var gr = g.createLinearGradient(0, 0, 0, 4); gr.addColorStop(0, "rgba(27,32,40,1)"); gr.addColorStop(1, "rgba(27,32,40,0)"); g.fillStyle = gr; g.fillRect(0, 0, W2, 4);
    if (box) check("The tooltip fits the picture", box.x1 + M <= W2 && box.y0 - y0 >= 0);
    return g;
  }

  function drawAll(){ CHECKS.length = 0;
    var tip = [["Seen by tracking compasses from up to " + n(SEEN) + " blocks away", "#ffffff"], ["Coated layers round it: " + LAYERS + " (" + n(BARE) + " blocks without them)", AQUA]];
    // the owner lines from "This totem is yours" down (the first line sits beside the foot of the tier box), and the strip with the bar hovered
    var tw = Math.max(mw(tip[0][0]), mw(tip[1][0])), mx = 80, wa = TW + 16, wb = Math.max(wa, 8 + mx + 12 + tw + 4 + 8);
    lower("r-a", 220, wa, true, null);
    lower("r-b", 248, wb, false, [mx, RAD_Y + 12, tip]);
    el("r-a").style.width = (100 * wa / wb) + "%";   // the same scale for both, the panels lined up on the left
    var bad = CHECKS.filter(function(c){ return !c.ok; }), out = el("checks");
    if (out) out.textContent = "Layout checks with the game's glyph widths: " + (CHECKS.length - bad.length) + " of " + CHECKS.length + " pass" + (bad.length ? ". Failing: " + bad.map(function(b){ return b.name; }).join("; ") : ".") + " Bare " + BARE + ", seen " + SEEN + ".";
    window.__plateChecks = CHECKS.slice();
  }

  font.onload = function(){ ready = true; drawAll(); };
  font.src = ASCII;
  drawAll();
})();
</script>
