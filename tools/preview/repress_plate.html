<title>Coin Re-press Plate</title>
<meta name="claude:viewport-fit-sides" content="cover">

:root{ --bg:#f3f1ea; --panel:#fff; --line:#d9d4c7; --fg:#1a1b20; --muted:#5f6472; color-scheme:light; }

:root[data-theme="dark"]{ --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#e8eaf0; --muted:#9aa3b5; color-scheme:dark; }
body{ background:var(--bg); color:var(--fg); font-family:"IBM Plex Sans",system-ui,sans-serif; margin:0; font-size:14px; line-height:1.5; }
.wrap{ max-width:1000px; margin:0 auto; padding:28px 16px 56px; display:flex; flex-direction:column; gap:16px; }
h1{ font-size:26px; margin:0; }
.checks{ font:12px ui-monospace,Menlo,monospace; color:var(--muted); }
canvas.gui{ width:100%; height:auto; display:block; image-rendering:pixelated; }
#plate{ display:flex; flex-direction:column; gap:12px; }
</style>

  // ------------------------------------------------------------ CoinFactoryScreen as built in 1.15.0 (326 x 226, re-pressing lanes in violet)
  var FW = 326, FH = 226, M = 8, LANE_TOP = 20, LANE_BOTTOM = 102, BAR_TOP = 50, BAR_H = 22, PIP_Y = 95, BLANK_Y = 31, TRAY_Y = 75,

  // the example: Mrgregles is in a team of 4 (maxPerTeamSize 10, 8, 7, 6, 5: 6 slices each) and owns this machine of 6 slices.

  // last Gold coin (one already out in the tray). A Gold coin takes 16 h, so a re-press 8 h, 6 h 48 m with one Motivator (-15%).
  var LANES = [
    { p: .62, mot: 1, input: ["gold_blank", 9] },
